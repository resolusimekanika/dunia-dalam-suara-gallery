<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post-Acoustic Instrumentology — Gallery</title>

  <style>
    :root {
      --red: #ef0000;
      --stage-max: 1160px;
      --image-column: 875px;
      --left-offset: clamp(24px, 8vw, 125px);
      --right-safe: 24px;

      --section-gap: clamp(34px, 4.2vw, 62px);
      --pair-gap: clamp(12px, 1.6vw, 22px);
      --cluster-gap: clamp(8px, 1vw, 12px);

      --text-color: rgba(255,255,255,.88);
      --text-muted: rgba(255,255,255,.68);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--red);
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text-color);
    }

    /*
      The gallery is intentionally left-aligned.
      The empty red field on the right belongs to the overall site composition.
    */
    #gallery {
      width: min(
        var(--stage-max),
        calc(100vw - var(--left-offset) - var(--right-safe))
      );
      margin-left: var(--left-offset);
      padding: 0 0 64px;
    }

    .section {
      width: 100%;
      margin: 0 0 var(--section-gap);
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .visual {
      width: min(100%, var(--image-column));
    }

    .gallery-item {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 0;
    }

    .gallery-link {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
      cursor: zoom-in;
    }

    .gallery-image {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }

    /* Portraits stay contained without feeling thumbnail-sized. */
    .gallery-item.portrait {
      display: flex;
      justify-content: flex-start;
    }

    .gallery-item.portrait .gallery-link {
      width: auto;
      max-width: 100%;
    }

    .gallery-item.portrait .gallery-image {
      width: auto;
      max-width: min(100%, 620px);
      max-height: 760px;
      object-fit: contain;
    }

    /* 03 + 04 */
    .visual--pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--pair-gap);
      align-items: start;
    }

    .visual--pair .gallery-item,
    .visual--pair .gallery-link,
    .visual--pair .gallery-image {
      width: 100%;
      max-width: 100%;
    }

    .visual--pair .gallery-image {
      max-height: 620px;
      object-fit: contain;
      object-position: top left;
    }

    /* 08 + 09 + 10 */
    .visual--triptych {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--cluster-gap);
      width: min(100%, 780px);
    }

    .visual--triptych .gallery-item,
    .visual--triptych .gallery-link,
    .visual--triptych .gallery-image {
      width: 100%;
      max-width: 100%;
    }

    .visual--triptych .gallery-image {
      max-height: 360px;
      object-fit: contain;
      object-position: top left;
    }

    /*
      Controlled scale changes only.
      These are subtle—not collage-like.
    */
    .visual--medium {
      width: min(76%, 665px);
    }

    .visual--small {
      width: min(56%, 490px);
    }

    .visual--closing {
      width: min(62%, 540px);
      margin-left: min(18%, 150px);
    }

    /*
      Research text:
      no boxes, borders, backgrounds, labels, or decorative treatment.
      Just editorial text placed in the same rhythm as the images.
    */
    .text {
      width: min(470px, 82%);
      margin-top: 22px;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: .003em;
      color: var(--text-muted);
      white-space: pre-line;
    }

    .text:empty {
      display: none;
    }

    .text--quote {
      width: min(560px, 86%);
      margin-left: 9%;
      font-size: clamp(17px, 1.45vw, 21px);
      line-height: 1.4;
      color: var(--text-color);
      font-style: italic;
    }

    /*
      Only one section uses the right field actively.
      This keeps the right margin meaningful without turning the whole
      page into an asymmetrical collage.
    */
    .section--with-side-note {
      display: grid;
      grid-template-columns: minmax(0, var(--image-column)) minmax(190px, 250px);
      column-gap: clamp(32px, 4vw, 62px);
      align-items: start;
    }

    .section--with-side-note .visual {
      grid-column: 1;
    }

    .section--with-side-note .text {
      grid-column: 2;
      width: 100%;
      margin: 6px 0 0;
      font-size: 14px;
      line-height: 1.5;
    }

    #status {
      width: min(
        var(--image-column),
        calc(100vw - var(--left-offset) - var(--right-safe))
      );
      margin-left: var(--left-offset);
      padding: 12px 0 24px;
      color: var(--text-muted);
      font: 13px/1.45 Arial, Helvetica, sans-serif;
    }

    #status:empty { display: none; }

    @media (max-width: 920px) {
      .section--with-side-note {
        grid-template-columns: minmax(0, 1fr);
      }

      .section--with-side-note .visual,
      .section--with-side-note .text {
        grid-column: 1;
      }

      .section--with-side-note .text {
        width: min(470px, 82%);
        margin-top: 22px;
      }
    }

    @media (max-width: 700px) {
      :root {
        --left-offset: 20px;
        --right-safe: 20px;
        --section-gap: 38px;
        --pair-gap: 12px;
        --cluster-gap: 8px;
      }

      #gallery {
        width: calc(100vw - 40px);
      }

      .visual--pair {
        grid-template-columns: 1fr 1fr;
      }

      .visual--triptych {
        width: 100%;
      }

      .visual--medium {
        width: 82%;
      }

      .visual--small {
        width: 65%;
      }

      .visual--closing {
        width: 70%;
        margin-left: 18%;
      }

      .gallery-item.portrait .gallery-image {
        max-width: 78vw;
        max-height: 660px;
      }

      .text,
      .text--quote,
      .section--with-side-note .text {
        width: 88%;
        margin-left: 0;
      }

      #status {
        width: calc(100vw - 40px);
        margin-left: 20px;
      }
    }
  </style>
</head>

<body>
  <main id="gallery"
    aria-label="Post-Acoustic Instrumentology: Dunia Dalam Suara [2025] image gallery">
  </main>

  <div id="status" role="status" aria-live="polite"></div>

  <script src="content.js"></script>

  <script>
    'use strict';

    const API = 'https://api.are.na/v3';
    const CHANNEL_SLUG =
      'post-acoustic-instrumentology-dunia-dalam-suara-2025';

    const BLOCK_IDS = [
      51152991,  // 01
      40204761,  // 02
      40204901,  // 03
      40204902,  // 04
      40204601,  // 05
      40204792,  // 06
      40204768,  // 07
      40204764,  // 08
      40204760,  // 09
      40204759,  // 10
      40204686,  // 11
      40204666,  // 12
      40204645,  // 13
      51152992   // 14
    ];

    const TEXT = window.GALLERY_TEXT || {};
    const gallery = document.getElementById('gallery');
    const statusEl = document.getElementById('status');

    function setStatus(message) {
      statusEl.textContent = message || '';
    }

    async function api(path) {
      const response = await fetch(API + path, {
        headers: { Accept: 'application/json' }
      });

      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }

      return response.json();
    }

    function variantSrc(variant) {
      if (!variant) return null;
      if (typeof variant === 'string') return variant;

      return (
        variant.src ||
        variant.src_2x ||
        variant.src_1x ||
        variant.url ||
        null
      );
    }

    function imageInfo(block) {
      const image =
        (block && block.image) ||
        (block && block.attachment && block.attachment.image) ||
        (block && block.embed && block.embed.image) ||
        null;

      if (!image || !image.src) return null;

      return {
        original: image.src,
        display:
          variantSrc(image.large) ||
          variantSrc(image.medium) ||
          variantSrc(image.small) ||
          image.src,
        width: Number(image.width) || null,
        height: Number(image.height) || null,
        alt:
          (block && block.alt_text) ||
          (block && block.title) ||
          image.filename ||
          ''
      };
    }

    function orientation(width, height) {
      if (!width || !height) return 'unknown';
      const ratio = width / height;
      if (ratio < 0.86) return 'portrait';
      if (ratio > 1.14) return 'landscape';
      return 'square';
    }

    function makeItem(block, originalIndex) {
      const info = imageInfo(block);
      if (!info) return null;

      const figure = document.createElement('figure');
      figure.className =
        'gallery-item ' + orientation(info.width, info.height);

      const link = document.createElement('a');
      link.className = 'gallery-link';
      link.href = info.original;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = 'Open original image';

      const img = document.createElement('img');
      img.className = 'gallery-image';
      img.src = info.display;
      img.alt =
        info.alt ||
        'Artwork documentation image ' +
          String(originalIndex + 1).padStart(2, '0');
      img.decoding = 'async';
      img.loading = originalIndex < 2 ? 'eager' : 'lazy';

      if (originalIndex === 0) img.fetchPriority = 'high';

      if (info.width && info.height) {
        img.width = info.width;
        img.height = info.height;
      } else {
        img.addEventListener('load', function () {
          figure.classList.remove(
            'unknown', 'portrait', 'landscape', 'square'
          );
          figure.classList.add(
            orientation(img.naturalWidth, img.naturalHeight)
          );
        }, { once: true });
      }

      link.appendChild(img);
      figure.appendChild(link);
      return figure;
    }

    async function getBlocks() {
      try {
        const response = await api(
          '/channels/' +
            encodeURIComponent(CHANNEL_SLUG) +
            '/contents?per=100&page=1'
        );

        const contents = Array.isArray(response && response.data)
          ? response.data
          : [];

        const byId = new Map(
          contents
            .filter(function (item) {
              return item && item.id != null;
            })
            .map(function (item) {
              return [Number(item.id), item];
            })
        );

        const missing = BLOCK_IDS.filter(function (id) {
          return !byId.has(id);
        });

        for (const id of missing) {
          try {
            const block = await api('/blocks/' + id);
            if (block && block.id != null) {
              byId.set(Number(block.id), block);
            }
          } catch (error) {
            console.error('Are.na block ' + id + ':', error);
          }
        }

        return BLOCK_IDS.map(function (id) {
          return byId.get(id) || null;
        });

      } catch (channelError) {
        const blocks = [];

        for (const id of BLOCK_IDS) {
          try {
            blocks.push(await api('/blocks/' + id));
          } catch (error) {
            blocks.push(null);
          }
        }

        return blocks;
      }
    }

    function visual(className, items) {
      const node = document.createElement('div');
      node.className = 'visual ' + className;

      items.forEach(function (item) {
        if (item) node.appendChild(item);
      });

      return node;
    }

    function text(kind, value) {
      const node = document.createElement('div');
      node.className = 'text' + (kind ? ' text--' + kind : '');
      node.textContent = (value || '').trim();
      return node;
    }

    function section(visualNode, textNode, extraClass) {
      const node = document.createElement('section');
      node.className = 'section' + (extraClass ? ' ' + extraClass : '');

      if (visualNode) node.appendChild(visualNode);
      if (textNode && textNode.textContent.trim()) node.appendChild(textNode);

      gallery.appendChild(node);
    }

    async function render() {
      setStatus('');

      try {
        const blocks = await getBlocks();
        const missing = [];

        const items = blocks.map(function (block, index) {
          const item = block ? makeItem(block, index) : null;
          if (!item) missing.push(BLOCK_IDS[index]);
          return item;
        });

        /*
          Restrained editorial rhythm:
          01 hero
          short note
          02
          03+04
          quote
          05 hero
          06 + one quiet side note
          07 smaller
          08+09+10 compact
          longer research text
          11
          12 smaller
          14 medium
          13 smaller closing image
        */
        section(
          visual('', [items[0]]),
          text('', TEXT.note01)
        );

        section(
          visual('visual--medium', [items[1]])
        );

        section(
          visual('visual--pair', [items[2], items[3]]),
          text('quote', TEXT.quote01)
        );

        section(
          visual('', [items[4]])
        );

        section(
          visual('visual--medium', [items[5]]),
          text('', TEXT.note02),
          'section--with-side-note'
        );

        section(
          visual('visual--small', [items[6]])
        );

        section(
          visual('visual--triptych', [items[7], items[8], items[9]]),
          text('', TEXT.paragraph01)
        );

        section(
          visual('visual--medium', [items[10]])
        );

        section(
          visual('visual--small', [items[11]])
        );

        /* 14 before 13, as requested */
        section(
          visual('visual--medium', [items[13]])
        );

        section(
          visual('visual--closing', [items[12]])
        );

        const count = items.filter(Boolean).length;

        if (count === 0) {
          setStatus('Could not connect to Are.na from this browser.');
        } else if (missing.length) {
          setStatus(
            'Loaded ' +
              count +
              ' of ' +
              BLOCK_IDS.length +
              ' images. Missing block' +
              (missing.length === 1 ? '' : 's') +
              ': ' +
              missing.join(', ') +
              '.'
          );
        }

      } catch (error) {
        console.error(error);
        setStatus('Could not connect to Are.na from this browser.');
      }
    }

    render();
  </script>
</body>
</html>
